name: CI
on:
  push: { branches: [main] }
  pull_request:
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21, cache: maven }
      - name: Build and test
        working-directory: backend
        run: mvn -B verify
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: surefire-reports, path: backend/target/surefire-reports }
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Syntax-check JavaScript modules
        run: for f in $(find frontend/js -name '*.js'); do node --input-type=module --check < "$f"; done
  docker:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t bookforward-backend .
      - run: docker build -t bookforward-frontend ./frontend
